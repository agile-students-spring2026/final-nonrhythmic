services:
  - type: web
    runtime: docker
    name: subvet-api
    branch: master
    dockerfilePath: ./back-end/Dockerfile
    dockerContext: ./back-end
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    runtime: docker
    name: subvet-web
    branch: master
    dockerfilePath: ./front-end/Dockerfile
    dockerContext: ./front-end
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: VITE_API_BASE_URL
        value: https://subvet-api.onrender.com/api
