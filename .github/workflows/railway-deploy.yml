name: Railway deployment

on:
  push:
    branches: [master]

concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy API service
        run: railway up back-end --service subvet-api --project "$RAILWAY_PROJECT_ID" --environment production --path-as-root --ci
      - name: Deploy web service
        run: railway up front-end --service subvet-web --project "$RAILWAY_PROJECT_ID" --environment production --path-as-root --ci
