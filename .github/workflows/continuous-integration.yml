name: Continuous integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build

  back-end:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 15s
    defaults:
      run:
        working-directory: back-end
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/subvet_ci
      JWT_SECRET: ci-jwt-secret-not-for-production-use-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ephemeral compose.env (gitignored locally; required by compose for api env_file)
        run: |
          printf '%s\n' \
            'JWT_SECRET=ci-docker-image-build-only-not-for-production' \
            'MONGO_URI=mongodb://mongo:27017/subvet' \
            > compose.env
      - name: Build container images
        run: docker compose build
